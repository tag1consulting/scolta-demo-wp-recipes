This mustard dip can be used as a dip or spread in place of butter or plain mayonnaise. Ingredients ½ cup Dijon mustard ¼ cup mayonnaise 1 tablespoon commercially-prepared horseradish Procedure Mix all the ingredients together. Store refrigerated for up to a few days.
