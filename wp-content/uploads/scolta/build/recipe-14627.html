Ingredients 1 large lemon, juiced 3 tbsp tahini 8 oz (220 g) plain yogurt or soy-based substitute 2 tbsp olive oil 3 cloves garlic, minced Procedure Add lemon juice to bowl or small food processor. Add remaining ingredients, and process well to combine.
