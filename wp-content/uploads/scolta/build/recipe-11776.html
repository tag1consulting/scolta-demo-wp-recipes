Ingredients ½ cup brewed espresso, cooled ⅓ cup granulated sugar 2 tbsp chocolate syrup 1 pinch of salt 2 cups heavy cream, whipped to soft peaks Procedure Combine espresso, sugar, chocolate, salt, and chocolate syrup. Gently fold in the whipped cream. Chill for 20 minutes; serve.
