This hot sauce tastes very much like Tabasco and other vinegar-based cayenne hot sauces. Ingredients ¾ cup malt vinegar ¼ cup cayenne pepper 1 tbsp salt Procedure Combine all ingredients. Store indefinitely at room temperature in a squirt bottle.
