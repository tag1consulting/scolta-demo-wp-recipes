Ingredients Rooibos teabags Fresh or powdered milk Water Brown sugar Equipment Cup Teaspoon Kettle Procedure Pour the water in the kettle and let it boil. Put the teabag in a cup, and pour the hot water in the cup. Stir in 1 teaspoon of brown sugar, then 1 teaspoon milk. Serve hot.
