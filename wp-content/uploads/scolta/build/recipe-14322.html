Ingredients ½ cup chipotle-based hot sauce ¼ cup adobo sauce ½ cup honey ½ cup tequila 1 cup chicken broth ¼ cup malt vinegar A few pieces of meat Procedure Combine all ingredients in a large zip-top plastic bag. Insert meat in and refrigerate for as long as you like.
