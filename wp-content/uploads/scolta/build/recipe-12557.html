Fry sauce is a simple condiment, used often with fries. It uses one part of tomato ketchup with two parts of mayonnaise. Ingredients 2 tsp mayonnaise 1 tsp tomato ketchup Procedure Combine the mayonnaise and ketchup. Mix until the sauce is a strong pink colour.
