This marinade and pork were made to go together! Ingredients 1 cup apple cider ¼ cup apple cider vinegar ¼ cup honey ½ tsp salt ½ tsp freshly ground black pepper 2 tbs smoked paprika Procedure Mix everything together. Keep refrigerated for up to 3 weeks.
