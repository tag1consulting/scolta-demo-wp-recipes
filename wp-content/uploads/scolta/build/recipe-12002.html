<h1>Chocolate Icing</h1>
<p data-pagefind-meta="url:https://wp-scolta-demo.ddev.site/recipe/chocolate-icing/" hidden></p>
<p data-pagefind-meta="date:2025-07-22" hidden></p>
Ingredients ¼ pound (110 g) sweet chocolate 2 tablespoons cream sifted confectioner’s sugar Procedure Melt chocolate over hot water. Add the cream. Gradually beat in sugar until icing is creamy and thick enough to spread.
