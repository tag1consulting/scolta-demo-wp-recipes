<h1>Brown Sugar Icing</h1>
<p data-pagefind-meta="url:/recipe/brown-sugar-icing/" hidden></p>
<p data-pagefind-meta="date:2025-07-22" hidden></p>
<span data-pagefind-filter="language:en" hidden></span>
<p data-pagefind-sort="date:2025-07-22" hidden></p>
Ingredients 2 cups (320 g / 11 oz) brown sugar 1 teaspoon vanilla ⅔ cup (165 ml / 5.6 oz) cream 1 tablespoon butter Procedure Boil sugar and cream together until a soft ball forms in cold water. Cool to 125 °F (52 °C). Add vanilla and butter; beat until thick enough to spread.
